<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Gravataí White Water Rafting | Home</title>
    <meta
      name="description"
      content="Welcome to Gravataí White Water Rafting, search for adventures in southern Brazil."
    />
    <meta name="author" content="Filipe Leonel Batista" />
    <link rel="stylesheet" href="styles/rafting.css" />
  </head>
  <body>
    <header>
      <img src="images/logo.jpg" alt="Gravataí White Water Rafting Logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
    <main>
      <div class="hero">
        <img
          src="images/hero.jpg"
          alt="Rafting team navigating rapids on Gravataí River"
        />
        <h1>Gravataí White Water Rafting | Welcome Aboard</h1>
      </div>
      <form class="contact-form" action="#" method="post">
        <div class="form-group">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" name="name" required />
        </div>
        <div class="form-group">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" name="email" required />
        </div>
        <div class="form-group newsletter-option">
          <input type="checkbox" id="newsletter" name="newsletter" />
          <label for="newsletter"
            >Please subscribe me to the monthly newsletter</label
          >
        </div>
        <button type="submit">Subscribe</button>
      </form>
      <section>
        <h2>Ready for some adventure?</h2>
        <a href="trips.html">Explore Trips</a>
      </section>
      <section>
        <h2>Adventure Awaits You in Gravataí!</h2>
        <div class="adventure-home-grid">
          <figure>
            <img
              src="images/rafting20_600.jpg"
              alt="Raft navigating Big Mallard rapids"
              width="300"
              height="200"
            />
            <p>
              Enjoy some adrenaline on this radical and emotional raft path with
              velocity with nature.
            </p>
            <figcaption>Big Mallard</figcaption>
          </figure>
          <figure>
            <img
              src="images/rafting53_600.jpg"
              alt="Calm Half Day Adventure float"
              width="300"
              height="200"
            />
            <p>
              This half-day trip is an exclusive experience if you do not have
              much time but want some adventure.
            </p>
            <figcaption>Half Day Adventure</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Gravataí White Water Rafting | Filipe Leonel Batista</p>
      <nav class="socialmedia">
        <a href="https://facebook.com"
          ><img src="images/facebook.svg" alt="Facebook Icon"
        /></a>
        <a href="https://linkedin.com"
          ><img src="images/linkedin.svg" alt="LinkedIn Icon"
        /></a>
        <a href="https://instagram.com"
          ><img src="images/instagram.svg" alt="Instagram Icon"
        /></a>
      </nav>
    </footer>
  </body>
</html>
