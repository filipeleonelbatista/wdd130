<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css" />
  </head>
  <body>
    <header>
      <h1>HTML and CSS Quiz</h1>
    </header>
    <main>
      <form>
        <div class="form-item">
          <label for="q1">What does HTML stand for?</label>
          <input type="text" id="q1" name="q1" />
        </div>

        <div class="form-item">
          <label for="q2">In your own words, what is CSS used for?</label>
          <textarea id="q2" name="q2" rows="4" placeholder="Describe how CSS styles a webpage..."></textarea>
        </div>

        <div class="form-item">
          <label for="q3">Which HTML element creates a hyperlink?</label>
          <select id="q3" name="q3">
            <option value="" selected disabled>Choose One ...</option>
            <option value="a">&lt;a&gt;</option>
            <option value="link">&lt;link&gt;</option>
            <option value="p">&lt;p&gt;</option>
          </select>
        </div>

        <div class="form-item">
          <label for="q4">How many heading levels does HTML provide?</label>
          <input type="number" id="q4" name="q4" />
        </div>

        <button type="submit">Submit Quiz</button>
      </form>
    </main>
    <footer>
      <p>HTML and CSS Quiz</p>
    </footer>
  </body>
</html>
